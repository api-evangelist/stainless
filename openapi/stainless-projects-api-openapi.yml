openapi: 3.2.0
info:
  title: Stainless Projects API
  version: 1.0.0
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: stainless.yml, stainless-sdk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: v1
tags:
- name: Projects
paths:
  /v0/projects:
    get:
      summary: List projects
      description: List projects in an organization, from oldest to newest.
      parameters:
      - in: query
        name: org
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
          description: Pagination cursor from a previous response
      - in: query
        name: limit
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 10
          description: 'Maximum number of projects to return, defaults to 10 (maximum: 100).'
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                required:
                - data
                - has_more
      tags:
      - Projects
      operationId: getV0Projects
      x-operation-id-source: derived
    post:
      summary: Create project
      description: Create a new project.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  description: Project name/slug
                org:
                  type: string
                  description: Organization name
                display_name:
                  type: string
                  description: Human-readable project name
                targets:
                  type: array
                  items:
                    $ref: '#/components/schemas/Target'
                  minItems: 1
                  description: Targets to generate for
                revision:
                  type: object
                  propertyNames:
                    type: string
                    description: File path
                  additionalProperties:
                    $ref: '#/components/schemas/FileInput'
                  description: File contents to commit
              required:
              - slug
              - org
              - display_name
              - targets
              - revision
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - Projects
      operationId: postV0Projects
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}:
    get:
      summary: Retrieve project
      description: Retrieve a project by name.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - Projects
      operationId: getV0ProjectsByProject
      x-operation-id-source: derived
    patch:
      summary: Update project
      description: Update a project's properties.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type:
                  - string
                  - 'null'
              description: A project is a collection of SDKs generated from the same set of config files.
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - Projects
      operationId: patchV0ProjectsByProject
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/generate_commit_message:
    post:
      summary: Generate an AI commit message for a specific SDK
      description: Generates an AI commit message by comparing two git refs in the SDK repository.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: query
        name: target
        schema:
          type: string
          enum:
          - python
          - node
          - typescript
          - java
          - kotlin
          - go
          - ruby
          - terraform
          - cli
          - csharp
          - php
          - openapi
          - sql
          description: Language target
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base_ref:
                  type: string
                  description: Base ref for comparison
                head_ref:
                  type: string
                  description: Head ref for comparison
              required:
              - base_ref
              - head_ref
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai_commit_message:
                    type: string
                required:
                - ai_commit_message
      tags:
      - Projects
      operationId: postV0ProjectsByProjectGenerateCommitMessage
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/branches:
    get:
      summary: List project branches
      description: Retrieve a project branch by name.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: query
        name: cursor
        schema:
          type: string
          description: Pagination cursor from a previous response
      - in: query
        name: limit
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          default: 10
          description: 'Maximum number of items to return, defaults to 10 (maximum: 100).'
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectBranchMinimal'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                required:
                - data
                - has_more
      tags:
      - Projects
      operationId: getV0ProjectsByProjectBranches
      x-operation-id-source: derived
    post:
      summary: Create a new project branch
      description: 'Create a new branch for a project.


        The branch inherits the config files from the revision pointed to by the

        `branch_from` parameter. In addition, if the revision is a branch name,

        the branch will also inherit custom code changes from that branch.'
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                  description: Branch name
                branch_from:
                  type: string
                  description: Branch or commit SHA to branch from
                force:
                  type: boolean
                  default: false
                  description: Whether to throw an error if the branch already exists. Defaults to false.
              required:
              - branch
              - branch_from
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBranch'
      tags:
      - Projects
      operationId: postV0ProjectsByProjectBranches
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/branches/{branch}:
    delete:
      summary: Delete a project branch
      description: Delete a project branch by name.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: path
        name: branch
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties: {}
      tags:
      - Projects
      operationId: deleteV0ProjectsByProjectBranchesByBranch
      x-operation-id-source: derived
    get:
      summary: Retrieve a project branch
      description: Retrieve a project branch by name.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: path
        name: branch
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBranch'
      tags:
      - Projects
      operationId: getV0ProjectsByProjectBranchesByBranch
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/branches/{branch}/rebase:
    put:
      summary: Rebase a project branch
      description: 'Rebase a project branch.


        The branch is rebased onto the `base` branch or commit SHA, inheriting

        any config and custom code changes.


        If `files` is provided, the auto-rebase is skipped: the branch is

        hard-reset to `base` and the provided files are committed on top.'
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: path
        name: branch
        schema:
          type: string
        required: true
      - in: query
        name: base
        schema:
          type: string
          default: main
          description: The branch or commit SHA to rebase onto. Defaults to "main".
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: object
                  propertyNames:
                    type: string
                    description: File path
                  additionalProperties:
                    $ref: '#/components/schemas/FileInput'
                  description: 'File contents to commit directly on top of `base`. When provided, the

                    auto-rebase is skipped and the branch is hard-reset to `base` before the

                    files are committed.'
                commit_message:
                  type: string
                  description: Optional commit message to use when `files` is provided.
              default: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBranch'
      tags:
      - Projects
      operationId: putV0ProjectsByProjectBranchesByBranchRebase
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/branches/{branch}/reset:
    put:
      description: 'Reset a project branch.


        If `branch` === `main`, the branch is reset to `target_config_sha`. Otherwise, the

        branch is reset to `main`.'
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: path
        name: branch
        schema:
          type: string
        required: true
      - in: query
        name: target_config_sha
        schema:
          type: string
          description: The commit SHA to reset the main branch to. Required if resetting the main branch; disallowed otherwise.
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBranch'
      tags:
      - Projects
      summary: Replace projects by project branches by branch reset
      x-summary-source: derived
      operationId: putV0ProjectsByProjectBranchesByBranchReset
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/configs:
    get:
      summary: Retrieve configuration files
      description: Retrieve the configuration files for a given project.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      - in: query
        name: branch
        schema:
          type: string
          default: main
          description: Branch name, defaults to "main".
      - in: query
        name: include
        schema:
          type: string
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                propertyNames:
                  type: string
                  description: File path
                additionalProperties:
                  type: object
                  properties:
                    content:
                      type: string
                      description: The file content
                  required:
                  - content
                description: Config files contents
      tags:
      - Projects
      operationId: getV0ProjectsByProjectConfigs
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{project}/configs/guess:
    post:
      summary: Generate config suggestions
      description: Generate suggestions for changes to config files based on an OpenAPI spec.
      parameters:
      - in: path
        name: project
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                  default: main
                  description: Branch name
                spec:
                  type: string
                  description: OpenAPI spec
              required:
              - spec
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                propertyNames:
                  type: string
                  description: File path
                additionalProperties:
                  type: object
                  properties:
                    content:
                      type: string
                      description: The file content
                  required:
                  - content
                description: Config files contents
      tags:
      - Projects
      operationId: postV0ProjectsByProjectConfigsGuess
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/projects/{projectName}/snippets/request:
    post:
      parameters:
      - in: path
        name: projectName
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  $ref: '#/components/schemas/Target'
                version:
                  type: string
                  enum:
                  - next
                  - latest_released
                request:
                  anyOf:
                  - type: object
                    properties:
                      method:
                        type: string
                      path:
                        type: string
                      parameters:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            in:
                              type: string
                              enum:
                              - path
                              - query
                              - header
                              - cookie
                            value: {}
                          required:
                          - name
                          - in
                      body:
                        type: object
                        properties:
                          fileParam:
                            type: string
                          filePath:
                            type: string
                    required:
                    - method
                    - path
                    - parameters
                  - type: object
                    properties:
                      method:
                        type: string
                      url:
                        type: string
                      postData:
                        allOf:
                        - type: object
                          properties:
                            mimeType:
                              type: string
                          required:
                          - mimeType
                        - anyOf:
                          - type: object
                            properties:
                              text:
                                type: string
                            required:
                            - text
                          - type: object
                            properties:
                              params:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    value:
                                      type: string
                                  required:
                                  - name
                            required:
                            - params
                      queryString:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            value: {}
                          required:
                          - name
                    required:
                    - method
                    - url
                    - queryString
              required:
              - language
              - version
              - request
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  snippet:
                    type: string
                required:
                - snippet
      tags:
      - Projects
      summary: Create projects by project name snippets request
      x-summary-source: derived
      operationId: postV0ProjectsByProjectNameSnippetsRequest
      x-operation-id-source: derived
    servers:
    - url: v1
components:
  schemas:
    CheckStep:
      oneOf:
      - type: object
        properties:
          status:
            type: string
            enum:
            - not_started
        required:
        - status
      - type: object
        properties:
          status:
            type: string
            enum:
            - waiting
          url:
            type:
            - string
            - 'null'
        required:
        - status
        - url
      - type: object
        properties:
          status:
            type: string
            enum:
            - queued
          url:
            type:
            - string
            - 'null'
        required:
        - status
        - url
      - type: object
        properties:
          status:
            type: string
            enum:
            - in_progress
          url:
            type:
            - string
            - 'null'
        required:
        - status
        - url
      - type: object
        properties:
          status:
            type: string
            enum:
            - completed
          completed:
            type: object
            properties:
              conclusion:
                $ref: '#/components/schemas/CheckConclusion'
              url:
                type:
                - string
                - 'null'
            required:
            - conclusion
            - url
            description: deprecated
          conclusion:
            $ref: '#/components/schemas/CheckConclusion'
          url:
            type:
            - string
            - 'null'
        required:
        - status
        - completed
        - conclusion
        - url
      discriminator:
        propertyName: status
    ProjectBranchMinimal:
      type: object
      properties:
        object:
          type: string
          enum:
          - project_branch
        branch:
          type: string
          description: Branch name
        org:
          type: string
        project:
          type: string
          description: Project name
        config_commit:
          type: object
          properties:
            sha:
              type: string
            repo:
              type: object
              properties:
                host:
                  type: string
                owner:
                  type: string
                name:
                  type: string
                branch:
                  type: string
              required:
              - host
              - owner
              - name
              - branch
            tree_oid:
              type:
              - string
              - 'null'
            stats:
              type:
              - object
              - 'null'
              properties:
                additions:
                  type: integer
                  minimum: 0
                deletions:
                  type: integer
                  minimum: 0
                total:
                  type: integer
                  minimum: 0
              required:
              - additions
              - deletions
              - total
          required:
          - sha
          - repo
          - tree_oid
          - stats
          description: 'A Git commit that points to the latest set of config files on a given

            branch.'
        latest_build_id:
          type: string
      required:
      - object
      - branch
      - org
      - project
      - config_commit
      - latest_build_id
      description: 'A project branch names a line of development for a project. Like a Git

        branch, it points to a Git commit with a set of config files. In addition, a

        project branch also points to a set of custom code changes, corresponding to

        Git branches in the staging repos.'
    Build:
      type: object
      properties:
        object:
          type: string
          enum:
          - build
        id:
          type: string
          description: Build ID
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        project:
          type: string
        org:
          type: string
        config_commit:
          type: string
        documented_spec:
          oneOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - content
              content:
                type: string
            required:
            - type
            - content
          - type: object
            properties:
              type:
                type: string
                enum:
                - url
              url:
                type: string
              expires:
                type: string
                format: date-time
            required:
            - type
            - url
            - expires
          - type: 'null'
        targets:
          type: object
          properties:
            node:
              $ref: '#/components/schemas/BuildTarget'
            typescript:
              $ref: '#/components/schemas/BuildTarget'
            python:
              $ref: '#/components/schemas/BuildTarget'
            go:
              $ref: '#/components/schemas/BuildTarget'
            java:
              $ref: '#/components/schemas/BuildTarget'
            kotlin:
              $ref: '#/components/schemas/BuildTarget'
            ruby:
              $ref: '#/components/schemas/BuildTarget'
            terraform:
              $ref: '#/components/schemas/BuildTarget'
            cli:
              $ref: '#/components/schemas/BuildTarget'
            php:
              $ref: '#/components/schemas/BuildTarget'
            csharp:
              $ref: '#/components/schemas/BuildTarget'
            sql:
              $ref: '#/components/schemas/BuildTarget'
            openapi:
              $ref: '#/components/schemas/BuildTarget'
          additionalProperties: false
      required:
      - object
      - id
      - updated_at
      - created_at
      - project
      - org
      - config_commit
      - documented_spec
      - targets
    CheckConclusion:
      type: string
      enum:
      - success
      - failure
      - skipped
      - cancelled
      - action_required
      - neutral
      - timed_out
    BuildTarget:
      type: object
      properties:
        object:
          type: string
          enum:
          - build_target
        status:
          type: string
          enum:
          - not_started
          - codegen
          - postgen
          - completed
        commit:
          $ref: '#/components/schemas/CommitStep'
        lint:
          $ref: '#/components/schemas/CheckStep'
        test:
          $ref: '#/components/schemas/CheckStep'
        build:
          $ref: '#/components/schemas/CheckStep'
        install_url:
          type:
          - string
          - 'null'
      required:
      - object
      - status
      - commit
      - install_url
    ProjectBranch:
      type: object
      properties:
        object:
          type: string
          enum:
          - project_branch
        branch:
          type: string
          description: Branch name
        org:
          type: string
        project:
          type: string
          description: Project name
        config_commit:
          type: object
          properties:
            sha:
              type: string
            repo:
              type: object
              properties:
                host:
                  type: string
                owner:
                  type: string
                name:
                  type: string
                branch:
                  type: string
              required:
              - host
              - owner
              - name
              - branch
            tree_oid:
              type:
              - string
              - 'null'
            stats:
              type:
              - object
              - 'null'
              properties:
                additions:
                  type: integer
                  minimum: 0
                deletions:
                  type: integer
                  minimum: 0
                total:
                  type: integer
                  minimum: 0
              required:
              - additions
              - deletions
              - total
          required:
          - sha
          - repo
          - tree_oid
          - stats
          description: 'A Git commit that points to the latest set of config files on a given

            branch.'
        latest_build:
          oneOf:
          - $ref: '#/components/schemas/Build'
          - type: 'null'
      required:
      - object
      - branch
      - org
      - project
      - config_commit
      - latest_build
      description: 'A project branch names a line of development for a project. Like a Git

        branch, it points to a Git commit with a set of config files. In addition, a

        project branch also points to a set of custom code changes, corresponding to

        Git branches in the staging repos.'
    Commit:
      type: object
      properties:
        sha:
          type: string
        repo:
          type: object
          properties:
            host:
              type: string
            owner:
              type: string
            name:
              type: string
            branch:
              type: string
          required:
          - host
          - owner
          - name
          - branch
        tree_oid:
          type:
          - string
          - 'null'
        stats:
          type:
          - object
          - 'null'
          properties:
            additions:
              type: integer
              minimum: 0
            deletions:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
          required:
          - additions
          - deletions
          - total
      required:
      - sha
      - repo
      - tree_oid
      - stats
    Target:
      type: string
      enum:
      - node
      - typescript
      - python
      - go
      - java
      - kotlin
      - ruby
      - terraform
      - cli
      - php
      - csharp
      - sql
      - openapi
    Project:
      type: object
      properties:
        object:
          type: string
          enum:
          - project
        slug:
          type: string
        display_name:
          type:
          - string
          - 'null'
        org:
          type: string
        config_repo:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
      - object
      - slug
      - display_name
      - org
      - config_repo
      - targets
      description: A project is a collection of SDKs generated from the same set of config files.
    CommitConclusion:
      type: string
      enum:
      - error
      - warning
      - note
      - success
      - merge_conflict
      - upstream_merge_conflict
      - fatal
      - payment_required
      - cancelled
      - timed_out
      - noop
      - version_bump
