openapi: 3.2.0
info:
  title: Stainless Build Target Outputs API
  version: 1.0.0
  description: 'Operations tagged Build Target Outputs across 2 of this provider''s published API definitions: stainless.yml, stainless-sdk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: v1
tags:
- name: Build Target Outputs
paths:
  /v0/build_target_outputs:
    get:
      summary: Download build target output
      description: 'Retrieve a method to download an output for a given build target.


        If the requested type of output is `source`, and the requested output

        method is `url`, a download link to a tarball of the source files is

        returned. If the requested output method is `git`, a Git remote, ref,

        and access token (if necessary) is returned.


        Otherwise, the possible types of outputs are specific to the requested

        target, and the output method _must_ be `url`. See the documentation for

        `type` for more information.'
      parameters:
      - in: query
        name: build_id
        schema:
          type: string
          description: Build ID
        required: true
      - in: query
        name: target
        schema:
          type: string
          enum:
          - node
          - typescript
          - python
          - go
          - java
          - kotlin
          - ruby
          - terraform
          - cli
          - php
          - csharp
          - sql
          - openapi
          description: SDK language target name
        required: true
      - in: query
        name: type
        schema:
          anyOf:
          - type: string
            enum:
            - source
            description: The raw source code generated by Stainless
          - type: string
            enum:
            - dist
            description: 'TypeScript: compiled dist tarball'
          - type: string
            enum:
            - wheel
            description: 'Python: wheel distribution package'
          - type: string
            enum:
            - openapi-with-transforms
            description: 'OpenAPI: spec with transforms applied'
          - type: string
            enum:
            - openapi-with-code-samples
            description: 'OpenAPI: spec with code samples'
          - type: string
            enum:
            - openapi-sdk-spec
            description: 'OpenAPI: internal SDK specification JSON'
          - type: string
            enum:
            - file
            description: 'File: Gets an arbitrary file from the source, used with the "path" parameter'
        required: true
      - in: query
        name: path
        schema:
          type: string
          description: 'The path of the file to get when used with "type": "file".'
      - in: query
        name: output
        schema:
          type: string
          enum:
          - url
          - git
          default: url
          description: 'Output format: url (download URL) or git (temporary access token).'
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    output:
                      type: string
                      enum:
                      - url
                    type:
                      anyOf:
                      - type: string
                        enum:
                        - source
                        description: The raw source code generated by Stainless
                      - type: string
                        enum:
                        - dist
                        description: 'TypeScript: compiled dist tarball'
                      - type: string
                        enum:
                        - wheel
                        description: 'Python: wheel distribution package'
                      - type: string
                        enum:
                        - openapi-with-transforms
                        description: 'OpenAPI: spec with transforms applied'
                      - type: string
                        enum:
                        - openapi-with-code-samples
                        description: 'OpenAPI: spec with code samples'
                      - type: string
                        enum:
                        - openapi-sdk-spec
                        description: 'OpenAPI: internal SDK specification JSON'
                      - type: string
                        enum:
                        - file
                        description: 'File: Gets an arbitrary file from the source, used with the "path" parameter'
                    target:
                      $ref: '#/components/schemas/Target'
                    url:
                      type: string
                      description: URL for direct download
                    path:
                      type: string
                      description: The path of the file, which is only present when using with the type "file" option.
                  required:
                  - output
                  - type
                  - target
                  - url
                - type: object
                  properties:
                    output:
                      type: string
                      enum:
                      - git
                    type:
                      anyOf:
                      - type: string
                        enum:
                        - source
                        description: The raw source code generated by Stainless
                      - type: string
                        enum:
                        - dist
                        description: 'TypeScript: compiled dist tarball'
                      - type: string
                        enum:
                        - wheel
                        description: 'Python: wheel distribution package'
                      - type: string
                        enum:
                        - openapi-with-transforms
                        description: 'OpenAPI: spec with transforms applied'
                      - type: string
                        enum:
                        - openapi-with-code-samples
                        description: 'OpenAPI: spec with code samples'
                      - type: string
                        enum:
                        - openapi-sdk-spec
                        description: 'OpenAPI: internal SDK specification JSON'
                      - type: string
                        enum:
                        - file
                        description: 'File: Gets an arbitrary file from the source, used with the "path" parameter'
                    target:
                      $ref: '#/components/schemas/Target'
                    token:
                      type: string
                      description: Temporary GitHub access token
                    url:
                      type: string
                      description: URL to git remote
                    ref:
                      type: string
                      description: Git reference (commit SHA, branch, or tag)
                  required:
                  - output
                  - type
                  - target
                  - token
                  - url
                  - ref
                discriminator:
                  propertyName: output
      tags:
      - Build Target Outputs
      operationId: getV0BuildTargetOutputs
      x-operation-id-source: derived
    servers:
    - url: v1
components:
  schemas:
    Target:
      type: string
      enum:
      - node
      - typescript
      - python
      - go
      - java
      - kotlin
      - ruby
      - terraform
      - cli
      - php
      - csharp
      - sql
      - openapi
x-refined-from:
- stainless.yml
- stainless-sdk-openapi.yml
