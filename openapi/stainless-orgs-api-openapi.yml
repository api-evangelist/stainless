openapi: 3.2.0
info:
  title: Stainless Orgs API
  version: 1.0.0
  description: 'Operations tagged Orgs across 2 of this provider''s published API definitions: stainless.yml, stainless-sdk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: v1
tags:
- name: Orgs
paths:
  /v0/orgs:
    get:
      summary: List organizations
      description: List organizations accessible to the current authentication method.
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Org'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                required:
                - data
                - has_more
      tags:
      - Orgs
      operationId: getV0Orgs
      x-operation-id-source: derived
    servers:
    - url: v1
  /v0/orgs/{org}:
    get:
      summary: Retrieve an organization
      description: Retrieve an organization by name.
      parameters:
      - in: path
        name: org
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
      tags:
      - Orgs
      operationId: getV0OrgsByOrg
      x-operation-id-source: derived
    servers:
    - url: v1
components:
  schemas:
    Org:
      type: object
      properties:
        object:
          type: string
          enum:
          - org
        slug:
          type: string
        display_name:
          type:
          - string
          - 'null'
        enable_ai_commit_messages:
          type: boolean
      required:
      - object
      - slug
      - display_name
      - enable_ai_commit_messages
x-refined-from:
- stainless.yml
- stainless-sdk-openapi.yml
