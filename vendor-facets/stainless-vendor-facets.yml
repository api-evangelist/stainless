  points: 4
  baseline_pass_rate: 0.127
- feature: decorated-spec
  check: openapi_examples
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    The added snippets are SDK calls, not request/response examples. The dimension reads examples first,
    so Stainless reaches only the Code Samples link fallback (0.25).
  points: 7
  baseline_pass_rate: 0.36
- feature: mcp-code-mode
  check: mcp_server
  layer: agent_readiness
  grade: platform
  provider_must: Deploy the server remotely and declare it.
  note: >-
    Code Mode exposes the same two tools (docs search, execute code) for every Stainless customer. That
    shared tool shape is what 0.22.0 grades `platform` (0.25). There is a fair argument that the SDK behind
    the executor is the provider's own. It belongs in the rubric, not in this row.
  points: 12
  baseline_pass_rate: 0.22
- feature: generated-skills
  check: agent_skills
  layer: agent_readiness
  credit: 0.25
  provider_must: Publish the generated SKILL.md where the catalog's skills harvest finds it.
  note: Generated from the spec rather than written by the provider, so the derived class.
  points: 5
  baseline_pass_rate: 0.236
- feature: generated-skills
  check: agent_skill_present
  layer: composite
  credit: 0.25
  provider_must: Declare the published skill as an AgentSkill entry.
  catalog_pass_rate: 0.033
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.236
earns_nothing:
- feature: decorated-spec
  check: examples_present
  why: >-
    x-codeSamples and x-stainless-snippets are SDK snippets. The check counts request or response examples.
- feature: decorated-spec
  check: overlay_published
  why: >-
    The decorated spec is a full copy of the OpenAPI with snippets added, not an OpenAPI Overlay document.
- feature: stl-skills
  check: agent_skill_present
  why: The stl skill teaches an agent to drive Stainless and says nothing about the customer's API.
- feature: sdk-generation
  check: idempotency
  layer: agent_readiness
  why: SDK retries do not add an idempotency key to the contract, and the dimension reads the contract.
out_of_reach:
  checks:
  - contract_present
  - examples_present
  - change_log_present
  - status_page_present
  - rate_limits_documented
  - well_known_published
  - postman_present
  - auth_clarity
  - error_semantics
  note: >-
    Stainless consumes the provider's OpenAPI; it does not author or repair it. Contract Quality and the
    contract-read agent-readiness dimensions stay where the provider left them.
unscored_practice:
- feature: terraform-generation
  why: A generated Terraform provider is a real integration surface that no check reads.
- feature: docs-markdown-llms
  why: Markdown served on Accept-header negotiation is agent-facing practice with no check.
