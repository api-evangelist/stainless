# Vendor facets — Stainless. SDK, CLI, Terraform and MCP generation plus a static docs platform,
# all from one OpenAPI. The headline: the SDK, CLI and docs pointers score in full once declared.
# The MCP server is Code Mode only, the same two tools (docs search, execute code) for every
# customer, so 0.22.0 grades it `platform`. Generated SKILL.md files count at the derived rate.
vendor: stainless
name: Stainless
website: https://www.stainless.com
areas:
- sdk-generation
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Stainless reaches the most Developer Ergonomics surface of the SDK generators: SDKs in eight or more
  languages, a generated CLI, and a static, server-light docs platform with an API reference, per-page
  Markdown and an llms.txt. Each counts once the provider declares it. Its MCP servers expose the same
  two Code Mode tools for every customer, so they score as `platform` (0.25 of 12). Its generated SKILL.md
  files are the derived class (0.25). The decorated OpenAPI adds SDK snippets, not request/response examples,
  and is not an Overlay document, so neither examples_present nor overlay_published moves. Unless the
  provider uses the docs platform or a default-hosted MCP server, Stainless output looks like the provider's
  own work.
features:
- id: sdk-generation
  name: SDK generation
  description: >-
    SDKs for TypeScript, Python, Go, Java, Kotlin, Ruby, C# and PHP generated from an OpenAPI, with testing
    and publishing.
  source: https://www.stainless.com/
  tier: paid
- id: cli-generation
  name: CLI generation
  description: >-
    A generated command-line tool for the API, generally available since January 2026, with streaming,
    pagination and shell completion.
  source: https://www.stainless.com/changelog/
  tier: paid
- id: terraform-generation
  name: Terraform provider generation
  description: Production-ready Terraform providers generated from the OpenAPI.
  source: https://www.stainless.com/docs
  tier: paid
- id: mcp-code-mode
  name: MCP server generation (Code Mode)
  description: >-
    An MCP server exposing two tools, a docs search and a code executor that runs TypeScript against the
    SDK, published to npm, Docker or MCPB, or hosted by Stainless, self-hosted or on Cloudflare Workers.
  source: https://www.stainless.com/docs/mcp/
  tier: all
- id: docs-platform
  name: Stainless Docs Platform
  description: >-
    An Astro static site with a generated language-specific API reference, MDX/Markdoc guides, faceted
    and AI search, hosted on Cloudflare with free custom domains or self-hosted. Public beta since March
    2026.
  source: https://www.stainless.com/docs/docs-platform/
  tier: paid
- id: docs-markdown-llms
  name: Per-page Markdown and llms.txt
  description: >-
    Every docs page has an LLM-friendly Markdown twin (.md suffix or Accept header), and an llms.txt can
    be added.
  source: https://www.stainless.com/docs/docs-platform/
  tier: paid
- id: decorated-spec
  name: Decorated OpenAPI with SDK code samples
  description: >-
    A copy of the OpenAPI with x-codeSamples, x-readme samples or x-stainless-snippets added per operation,
    delivered by GitHub Action or a hosted URL, for Mintlify, ReadMe, GitBook, Redocly or bump.sh.
  source: https://www.stainless.com/docs/docs-integrations/
  tier: all
- id: generated-skills
  name: Generated SKILL.md for the customer's API
  description: Stainless states it auto-generates SKILL.md files for the customer's API.
  source: https://www.stainless.com/blog/steps-toward-great-agent-experience-every-api-provider-can-take-today
  tier: unknown
- id: stl-skills
  name: Stainless CLI skill (stl skills)
  description: Installs a skill that teaches coding agents to use the Stainless CLI.
  source: https://www.stainless.com/changelog/
  tier: all
